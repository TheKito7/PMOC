<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PMOC Energisa - Login</title>


    <!-- CSS principal -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <main class="login-container">


        <section class="login-card">


            <div class="logo-area">

               <img src="imagens/logo/Grupo_Energisa.svg.webp" alt="Grupo energisa" class="logo-energisa">

                <p>
                    PMOC
                </p>

                <span>
                    Gestão de Climatização
                </span>

            </div>



            <form id="loginForm">


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input 
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail">

                </div>



                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input 
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha">

                </div>



                <button type="submit">

                    Entrar

                </button>
                
                <p class="rodape-login">
                    Sistema de Gestão de Climatização
                </p>

                <p id="mensagem"></p>


            </form>


        </section>


    </main>




    <!-- JavaScript do login -->

    <script 
    type="module"
    src="js/login.js">
    </script>


</body>


</html>
